[sdl]
windowresolution=960x600
fullresolution=desktop
output=openglnb

[dosbox]
# 16 MB of RAM
memsize=16

[render]
# Preserve aspect ratio when scaling to fill the window
aspect=true
scaler=none

[cpu]
core=auto
# 486DX2 at 66 MHz ~ 25000 cycles in DOSBox
cputype=486_slow
cycles=25000

[dos]
xms=true
ems=true
umb=true

[autoexec]
mount c .
c:
endless.exe
exit
