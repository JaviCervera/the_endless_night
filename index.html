<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Endless Night</title>
  <link rel="stylesheet" href="assets/js-dos/js-dos.css">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }

    #dos {
      width: 100%;
      height: 100%;
    }

    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1em;
      color: #cfcfcf;
      font: 16px/1.4 monospace;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="status">Loading The Endless Night...</div>
  <div id="dos"></div>
  <script src="assets/js-dos/js-dos.js"></script>
  <script>
    (async function () {
      const status = document.getElementById("status");
      try {
        const [dosboxConf, manifest] = await Promise.all([
          fetch("dosbox.conf").then((response) => {
            if (!response.ok) {
              throw new Error("dosbox.conf: HTTP " + response.status);
            }
            return response.text();
          }),
          fetch("files.json").then((response) => {
            if (!response.ok) {
              throw new Error("files.json: HTTP " + response.status);
            }
            return response.json();
          }),
        ]);

        const initFs = await Promise.all(manifest.map(async (path) => {
          const response = await fetch(path);
          if (!response.ok) {
            throw new Error(path + ": HTTP " + response.status);
          }
          return {
            path,
            contents: new Uint8Array(await response.arrayBuffer()),
          };
        }));

        status.remove();

        Dos(document.getElementById("dos"), {
          dosboxConf,
          initFs,
          pathPrefix: new URL("assets/js-dos/emulators/", location.href).href,
          // The DJGPP build needs a DPMI host; the plain DOSBox backend in
          // js-dos does not provide one and hangs on CWSDPMI, so use DOSBox-X.
          backend: "dosboxX",
          backendLocked: true,
        });
      } catch (error) {
        status.textContent = "Failed to load the game: " + error.message;
        console.error(error);
      }
    })();
  </script>
</body>

</html>
